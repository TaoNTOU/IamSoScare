<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>災防資料庫</title>
<style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#20313d;background:#f2f5f7}
*{box-sizing:border-box}
body{margin:0}
header{background:#153945;color:white;padding:22px}
main,footer{max-width:1000px;margin:auto;padding:28px 20px}
h1{font-size:clamp(1.8rem,5vw,2.6rem)}
p{line-height:1.8;color:#607480}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{display:block;padding:26px;border:1px solid #dce5e9;border-radius:14px;background:white;text-decoration:none;color:inherit}
a.card:hover{border-color:#116b70;background:#f3fafa}
h2{margin:0 0 12px;font-size:1.3rem}
.card p{margin:0 0 18px}
.tag{font-size:.85rem;color:#116b70;font-weight:700}
footer{font-size:.8rem;color:#607480}
:focus-visible{outline:3px solid #d28a26;outline-offset:4px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><strong>災防資料庫</strong></header>
<main>
  <h1>讓資訊成為應變的準備。</h1>
  <p>彙整降雨監測與演習規劃資料，提供日常查閱與防災工作參考。</p>

  <div class="grid">
    <a class="card" href="./model/rainAlert.html">
      <h2>降雨警戒</h2>
      <p>查看基隆市一小時與三小時雨量監測圖。</p>
      <span class="tag">開啟雨量監測 →</span>
    </a>

    <section class="card" aria-labelledby="hseep-title">
      <h2 id="hseep-title">HSEEP 演習</h2>
      <p>演習介紹、情境設定與主要事件清單（MSEL）。</p>
      <span class="tag">模板準備中</span>
    </section>
  </div>
</main>
<footer>資料供工作參考；非災情通報或緊急救援受理管道。</footer>
</body>
</html>
