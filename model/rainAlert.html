<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>降雨警戒 | 災防資料庫</title>
<style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#20313d;background:#f2f5f7}
*{box-sizing:border-box}
body{margin:0}
header{background:#153945;color:white;padding:22px}
header a{color:white;text-decoration:none}
main{max-width:1200px;margin:auto;padding:28px 20px}
.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:1.8rem;margin:0}
p{line-height:1.8;color:#607480}
button{font:inherit;cursor:pointer}
.refresh,.close{padding:10px 16px;border:0;border-radius:8px;background:#116b70;color:white}
figure{margin:22px 0;background:white;border:1px solid #dce5e9;border-radius:12px;overflow:hidden}
figcaption{padding:14px 18px;background:#eaf2f4;font-weight:700}
.image-button{display:block;width:100%;padding:0;border:0;background:white;cursor:zoom-in}
.image-button img{display:block;width:100%;height:auto}
.error{padding:0 18px;color:#a53629}
table{width:100%;border-collapse:collapse;background:white}
caption{text-align:left;font-weight:700;padding:12px 0}
th,td{padding:12px;text-align:left;border-bottom:1px solid #dce5e9;line-height:1.7}
th{background:#eaf2f4}
.note,#status{font-size:.85rem}
dialog{width:min(1500px,94vw);max-width:94vw;max-height:94vh;padding:14px;border:0;border-radius:12px}
dialog::backdrop{background:rgb(0 0 0 / 75%)}
.close{display:block;margin:0 0 12px auto}
dialog img{display:block;width:100%;height:auto}
:focus-visible{outline:3px solid #d28a26;outline-offset:4px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><a href="../index.html">← 災防資料庫首頁</a></header>
<main>
  <div class="heading">
    <h1>基隆市降雨警戒</h1>
    <button class="refresh" id="refresh" type="button">更新圖片</button>
  </div>
  <p>點擊圖片可放大；觀測時間與警戒線以圖內標示為準。</p>
  <p id="status" role="status">正在載入圖片…</p>

  <figure>
    <figcaption>一小時雨量</figcaption>
    <button class="image-button" type="button" aria-label="放大一小時雨量圖">
      <img data-file="基隆市一小時雨量.png" alt="基隆市一小時雨量警戒圖">
    </button>
    <p class="error" hidden>圖片載入失敗，請稍後更新。</p>
  </figure>

  <figure>
    <figcaption>三小時雨量</figcaption>
    <button class="image-button" type="button" aria-label="放大三小時雨量圖">
      <img data-file="基隆市三小時雨量.png" alt="基隆市三小時雨量警戒圖">
    </button>
    <p class="error" hidden>圖片載入失敗，請稍後更新。</p>
  </figure>

  <table>
    <caption>工作通報門檻</caption>
    <thead><tr><th scope="col">層級</th><th scope="col">雨量條件</th></tr></thead>
    <tbody>
      <tr><th scope="row">通報</th><td>一小時 ≥ 20 mm</td></tr>
      <tr><th scope="row">加發通報</th><td>一小時 ≥ 40 mm，或三小時 ≥ 70 mm</td></tr>
    </tbody>
  </table>

  <p class="note">
    每 10 分鐘重新載入圖片，載入時間不代表觀測時間。
    以上為工作用門檻，非中央氣象署大雨、豪雨分級標準。
    圖片未更新或載入失敗不代表無降雨或無警戒。
    實際應變請依權責機關公告及作業規定辦理。
  </p>
</main>

<dialog id="viewer">
  <button class="close" id="close" type="button">關閉 ✕</button>
  <img id="large" alt="">
</dialog>

<script>
(() => {
  const images = [...document.querySelectorAll('figure img')];
  const status = document.getElementById('status');
  const refresh = document.getElementById('refresh');
  const viewer = document.getElementById('viewer');
  const large = document.getElementById('large');
  let loading = false;

  function loadImage(img, version) {
    return new Promise(resolve => {
      const probe = new Image();
      const url = '../database/fig/' +
        encodeURIComponent(img.dataset.file) + '?v=' + version;
      const error = img.closest('figure').querySelector('.error');
      let finished = false;

      function finish(ok) {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        probe.onload = probe.onerror = null;
        error.hidden = ok;
        img.parentElement.hidden = !ok;
        if (ok) img.src = url;
        resolve(ok);
      }

      const timer = setTimeout(() => finish(false), 30000);
      probe.onload = () => finish(true);
      probe.onerror = () => finish(false);
      probe.src = url;
    });
  }

  async function update() {
    if (loading) return;
    loading = true;
    refresh.disabled = true;
    status.textContent = '正在載入圖片…';

    try {
      const version = Date.now();
      const results = await Promise.all(
        images.map(img => loadImage(img, version))
      );
      const failed = results.filter(ok => !ok).length;
      const time = new Date().toLocaleString('zh-TW', {
        timeZone: 'Asia/Taipei',
        hour12: false
      });

      status.textContent = failed
        ? `有 ${failed} 張圖片載入失敗，請稍後重試。`
        : `圖片載入時間：${time}（臺灣時間）`;
    } finally {
      loading = false;
      refresh.disabled = false;
    }
  }

  images.forEach(img => {
    img.parentElement.addEventListener('click', () => {
      if (!img.complete || !img.naturalWidth) return;
      large.src = img.src;
      large.alt = img.alt;
      viewer.showModal();
    });
  });

  document.getElementById('close').addEventListener('click', () => {
    viewer.close();
  });

  viewer.addEventListener('click', event => {
    if (event.target === viewer) viewer.close();
  });

  refresh.addEventListener('click', update);
  update();
  setInterval(update, 10 * 60 * 1000);
})();
</script>
</body>
</html>
